<style>
*{box-sizing:border-box}
body{

.app{

header{

.muted{color:#929baa}

    margin-top:15px;

    font-size:13px
}
.gold{color:#ffb703;font-weight:bold}

.case-menu{

    gap:8px;
    overflow-x:auto;
    padding:15px 0
}
.case-menu button{

    background:#191e28;
    color:white;
    border:1px solid #303746;
    padding:9px 13px;
    border-radius:8px;
    cursor:pointer
}
.case-menu button.active{
    background:#e63946;
    border-color:#e63946
}
.card{
    background:#131720;
    border:1px solid #292f3c;
    border-radius:14px;
    padding:16px;
    margin-bottom:14px
}
.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    margin-bottom:8px
}
.easy{background:#064e3b;color:#6ee7b7}
.medium{background:#78350f;color:#fcd34d}
.hard{background:#7f1d1d;color:#fca5a5}

.tabs{
    display:flex;
    border-bottom:1px solid #292f3c;
    margin-bottom:14px
}
.tab{
    flex:1;
    background:none;
    border:0;
    color:#8d97a6;
    padding:11px 5px;
    cursor:pointer;
    font-weight:bold
}
.tab.active{
    color:#e63946;
    border-bottom:2px solid #e63946
}
.panel{display:none}
.panel.active{display:block}

.item{
    background:#1a1f29;
    border:1px solid #2d3442;
    padding:13px;
    border-radius:10px;
    margin-bottom:9px;
    line-height:1.6
}
.name{
    color:#ffb703;
    font-weight:bold;
    font-size:15px
}

.chat{
    height:240px;
    overflow-y:auto;
    background:#080a0e;
    border:1px solid #292f3c;
    border-radius:10px;
    padding:10px;
    margin-bottom:8px
}
.msg{
    padding:9px;
    border-radius:9px;
    margin-bottom:8px;
    font-size:13px;
    line-height:1.5
}
.user{
    background:#1e3a8a;
    text-align:left
}
.suspect{
    background:#27272a;
    border-right:3px solid #ffb703
}

.controls{
    display:flex;
    gap:7px;
    margin-top:7px
}
input,select{
    flex:1;
    min-width:0;
    background:#0d1118;
    color:white;
    border:1px solid #303746;
    border-radius:8px;
    padding:10px
}
button.action{
    background:#e63946;
    color:white;
    border:0;
    border-radius:8px;
    padding:10px 15px;
    font-weight:bold;
    cursor:pointer
}
button.action:hover{opacity:.85}

.accuse{
    margin-top:16px;
    padding:15px;
    border-radius:12px;
    background:#241114;
    border:1px solid #7f1d1d
}
.accuse select{
    width:100%;
    margin:10px 0
}
.result{
    display:none;
    margin-top:10px;
    padding:12px;
    border-radius:9px;
    line-height:1.6
}
.correct{
    display:block;
    background:#064e3b;
    border:1px solid #10b981;
    color:#a7f3d0
}
.wrong{
    display:block;
    background:#7f1d1d;
    border:1px solid #ef4444;
    color:#fecaca
}
</style>
</head>

title:"الطاولة السادسة",
difficulty:"easy",
desc:"اختفى شيء من طاولة في مطعم مزدحم.",
culprit:"منصور",
evidence:["🪑 رقم الطاولة","🧾 إيصال الطلب","📹 كاميرا المطعم"],
suspects:[
{name:"منصور",role:"زبون",clue:"جلس وحده على الطاولة.",answer:"لم آخذ شيئاً."},
{name:"منير",role:"نادل",clue:"مر بالطاولة.",answer:"كنت أقدم الطلبات."},
{name:"مساعد",role:"زبون",clue:"جلس قريباً.",answer:"لم ألمس الطاولة."},
{name:"عبدالباري",role:"زائر",clue:"غادر قبل الحادث.",answer:"كنت قد خرجت."}
]
},

{
title:"الساعة 11:11",
difficulty:"hard",
desc:"كل الأدلة تشير إلى وقت واحد، لكن أحدها مزيف.",
culprit:"مساعد",
evidence:["⏱️ سجل الوقت","⌚ بطارية الساعة","📝 شهادة الشاهد"],
suspects:[
{name:"مساعد",role:"موظف",clue:"كان يعرف أن الساعة لا تعمل.",answer:"لم ألاحظ شيئاً."},
{name:"منصور",role:"مدير",clue:"اعتمد على الساعة.",answer:"ظننت أنها دقيقة."},
{name:"منير",role:"حارس",clue:"كتب وقت الحادث.",answer:"هذا ما رأيته."},
{name:"عبدالباري",role:"فني",clue:"فحص الساعة.",answer:"كانت تحتاج بطارية."}
]
}

];

let current=0;
let score=0;
let solved=new Set();
let seconds=0;

function renderMenu(){
    document.getElementById("caseMenu").innerHTML=
    cases.map((c,i)=>`
    <button class="${i===current?"active":""}" onclick="loadCase(${i})">
    القضية ${i+1}
    </button>`).join("");
}

function loadCase(index){
    current=index;
    const c=cases[index];

    renderMenu();

    document.getElementById("game").innerHTML=`

    <div class="card">
        <span class="badge ${c.difficulty}">
        ${c.difficulty==="easy"?"🟢 سهل":c.difficulty==="medium"?"🟡 متوسط":"🔴 صعب"}
        </span>

        <h2>${c.title}</h2>
        <p class="muted">${c.desc}</p>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('suspects',this)">
        👤 المشتبهون
        </button>

        <button class="tab" onclick="switchTab('evidence',this)">
        🔎 الأدلة
        </button>

        <button class="tab" onclick="switchTab('interrogate',this)">
        💬 الاستجواب
        </button>
    </div>

    <div id="suspects" class="panel active">
        ${c.suspects.map(s=>`
        <div class="item">
            <div class="name">${s.name}</div>
            <div class="muted">${s.role}</div>
            <p>🔍 ${s.clue}</p>
        </div>
        `).join("")}
    </div>

    <div id="evidence" class="panel">
        ${c.evidence.map((e,i)=>`
        <div class="item">
            <b>الدليل ${i+1}</b><br>
            ${e}
        </div>
        `).join("")}
    </div>

    <div id="interrogate" class="panel">

        <div id="chat" class="chat">
            <div class="msg suspect">
                🕵️ اختر مشتبهًا وابدأ الاستجواب.
            </div>
        </div>

        <div class="controls">
            <select id="who">
                ${c.suspects.map(s=>`
                <option value="${s.name}">${s.name}</option>
                `).join("")}
            </select>
        </div>

        <div class="controls">
            <input id="question"
            placeholder="اسأل: أين كنت؟ ماذا تعرف؟ ماذا رأيت؟">

            <button class="action" onclick="ask()">
            استجواب
            </button>
        </div>

    </div>

    <div class="accuse">

        <b>⚖️ إصدار الاتهام النهائي</b>

        <select id="accuseSelect">
            ${c.suspects.map(s=>`
            <option>${s.name}</option>
            `).join("")}
        </select>

        <button class="action"
        style="width:100%"
        onclick="submitAccusation()">
        إغلاق القضية
        </button>

        <div id="result" class="result"></div>

    </div>
    `;
}

function switchTab(id,button){

    document.querySelectorAll(".panel")
    .forEach(p=>p.classList.remove("active"));

    document.getElementById(id).classList.add("active");

    document.querySelectorAll(".tab")
    .forEach(t=>t.classList.remove("active"));

    button.classList.add("active");
}

function ask(){

    const q=document.getElementById("question").value.trim();

    if(!q)return;

    const who=document.getElementById("who").value;
    const c=cases[current];

    const suspect=c.suspects.find(s=>s.name===who);

    let answer=suspect.answer;

    if(q.includes("أين")||q.includes("وين")){
        answer=suspect.name===c.culprit
        ?"كنت قريباً من المكان، لكن لا أريد الدخول في التفاصيل."
        :"كنت في مكان آخر وقت الحادث.";
    }

    if(q.includes("دليل")||q.includes("البصم")||q.includes("الكاميرا")){
        answer=suspect.clue;
    }

    const chat=document.getElementById("chat");

    chat.innerHTML+=`
    <div class="msg user">
        أنت: ${q}
    </div>

    <div class="msg suspect">
        ${who}: ${answer}
    </div>
    `;

    chat.scrollTop=chat.scrollHeight;

    document.getElementById("question").value="";
}

function submitAccusation(){

    const selected=document.getElementById("accuseSelect").value;
    const c=cases[current];
    const result=document.getElementById("result");

    result.className="result";

    if(selected===c.culprit){

        if(!solved.has(current)){
            solved.add(current);
            score+=100;
        }

        result.classList.add("correct");

        result.innerHTML=`
        <b>✅ تم حل القضية!</b><br>
        الجاني هو <b>${c.culprit}</b>.<br><br>
        🔎 الدليل الحاسم: ${c.evidence[0]}<br>
        🎯 حصلت على 100 نقطة.
        `;

    }else{

        score=Math.max(0,score-25);

        result.classList.add("wrong");

        result.innerHTML=`
        <b>❌ الاتهام خاطئ.</b><br>
        تم خصم 25 نقطة.<br>
        راجع الأدلة والاستجوابات وحاول مرة أخرى.
        `;
    }

    updateStats();
}

function updateStats(){

    document.getElementById("score").textContent=score;

    document.getElementById("solved").textContent=
    `${solved.size}/20`;
}

setInterval(()=>{

    seconds++;

    const minutes=String(Math.floor(seconds/60)).padStart(2,"0");
    const secs=String(seconds%60).padStart(2,"0");

    document.getElementById("timer").textContent=
    `${minutes}:${secs}`;

},1000);

renderMenu();
loadCase(0);

</script>

</body>
</html>
